<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd3ea"/><stop offset=".4" stop-color="#f6b0dc"/><stop offset=".75" stop-color="#d6a8f0"/><stop offset="1" stop-color="#b693ea"/>
    </linearGradient>
    <clipPath id="clip"><path id="shape" d="M240 430 C240 350 325 322 425 330 L655 330 C755 322 840 350 840 430 L895 680 C918 775 845 830 790 790 L700 730 L380 730 L290 790 C235 830 162 775 185 680 Z"/></clipPath>
    <linearGradient id="glass" x1="0" x2="1">
      <stop offset="0" stop-color="#8fe9ff" stop-opacity=".8"/><stop offset=".4" stop-color="#f2feff" stop-opacity=".35"/><stop offset="1" stop-color="#58c2e8" stop-opacity=".85"/>
    </linearGradient>
    <radialGradient id="sclera" cx="50%" cy="60%" r="60%">
      <stop offset="0" stop-color="#fff"/><stop offset=".6" stop-color="#ffdede"/><stop offset="1" stop-color="#ff8c8c"/>
    </radialGradient>
    <radialGradient id="stick" cx="40%" cy="35%" r="70%">
      <stop offset="0" stop-color="#fff3fa"/><stop offset="1" stop-color="#e6b5d8"/>
    </radialGradient>
    <radialGradient id="ember" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#fff3a0"/><stop offset=".5" stop-color="#ff8a00"/><stop offset="1" stop-color="#ff3d00" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- smoke cloud -->
  <g fill="#f3eefb" stroke="#c4b9d8" stroke-width="6">
    <circle cx="430" cy="215" r="62"/><circle cx="520" cy="180" r="78"/><circle cx="620" cy="200" r="68"/><circle cx="700" cy="235" r="50"/>
    <circle cx="360" cy="245" r="40"/><circle cx="575" cy="110" r="34"/><circle cx="640" cy="80" r="22"/>
  </g>

  <!-- triggers + bumpers -->
  <g stroke="#2a1640" stroke-width="15" stroke-linejoin="round">
    <path d="M300 335 Q312 280 390 274 L448 280 Q460 310 452 340 Z" fill="#f2a8d6"/>
    <path d="M780 335 Q768 280 690 274 L632 280 Q620 310 628 340 Z" fill="#f2a8d6"/>
    <rect x="290" y="318" width="180" height="40" rx="20" fill="#ffc4e6"/>
    <rect x="610" y="318" width="180" height="40" rx="20" fill="#ffc4e6"/>
  </g>

  <!-- body with subtle marble -->
  <use href="#shape" fill="url(#body)"/>
  <g clip-path="url(#clip)" fill="none" stroke-linecap="round">
    <path d="M200 540 C320 500 400 580 520 545 S730 470 900 530" stroke="#c9a8f0" stroke-opacity=".35" stroke-width="22"/>
    <path d="M220 650 C330 615 440 690 560 660 S760 600 910 650" stroke="#fff" stroke-opacity=".3" stroke-width="18"/>
    <path d="M270 400 C340 370 400 430 470 405" stroke="#fff" stroke-opacity=".4" stroke-width="12"/>
  </g>
  <use href="#shape" fill="none" stroke="#2a1640" stroke-width="24" stroke-linejoin="round"/>
  <path d="M300 395 C315 362 365 352 430 355 L650 355 C710 353 755 362 782 380" fill="none" stroke="#fff" stroke-opacity=".75" stroke-width="12" stroke-linecap="round"/>

  <!-- guide button -->
  <circle cx="540" cy="378" r="34" fill="#9dffb4" opacity=".35"/>
  <circle cx="540" cy="378" r="24" fill="#faf6fc" stroke="#2a1640" stroke-width="8"/>
  <circle cx="540" cy="378" r="10" fill="#7dff9a"/>

  <!-- left stick -->
  <circle cx="335" cy="440" r="50" fill="#2a1640"/><circle cx="335" cy="440" r="40" fill="url(#stick)"/>
  <circle cx="335" cy="440" r="24" fill="none" stroke="#d9a3c9" stroke-width="5"/>
  <!-- right stick -->
  <circle cx="680" cy="630" r="46" fill="#2a1640"/><circle cx="680" cy="630" r="37" fill="url(#stick)"/>
  <circle cx="680" cy="630" r="22" fill="none" stroke="#d9a3c9" stroke-width="5"/>
  <!-- d-pad -->
  <circle cx="405" cy="630" r="46" fill="#efc0e0" stroke="#2a1640" stroke-width="9"/>
  <path d="M392 597 h26 v20 h20 v26 h-20 v20 h-26 v-20 h-20 v-26 h20 Z" fill="#fbe2f2" stroke="#2a1640" stroke-width="5"/>
  <!-- ABXY compact -->
  <g fill="#fbd6ec" stroke="#2a1640" stroke-width="6">
    <circle cx="745" cy="405" r="19"/><circle cx="777" cy="438" r="19"/><circle cx="713" cy="438" r="19"/><circle cx="745" cy="471" r="19"/>
  </g>
  <g font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="19" text-anchor="middle" fill="#6a4a7a">
    <text x="745" y="412">Y</text><text x="777" y="445">B</text><text x="713" y="445">X</text><text x="745" y="478">A</text>
  </g>

  <!-- FACE: stoned, chill, a little grumpy -->
  <!-- eyes -->
  <g stroke="#2a1640" stroke-width="10">
    <ellipse cx="478" cy="470" rx="46" ry="40" fill="url(#sclera)"/>
    <ellipse cx="604" cy="470" rx="46" ry="40" fill="url(#sclera)"/>
  </g>
  <g stroke="#e05050" stroke-width="3" fill="none" stroke-linecap="round" opacity=".8">
    <path d="M440 480 l14 2"/><path d="M445 495 l12 -6"/><path d="M642 480 l-14 2"/><path d="M637 495 l-12 -6"/>
  </g>
  <circle cx="484" cy="482" r="15" fill="#2a1640"/><circle cx="598" cy="482" r="15" fill="#2a1640"/>
  <circle cx="489" cy="477" r="5" fill="#fff"/><circle cx="603" cy="477" r="5" fill="#fff"/>
  <!-- heavy lids (half closed) -->
  <g fill="#f6b8de" stroke="#2a1640" stroke-width="10" stroke-linejoin="round">
    <path d="M432 470 A46 40 0 0 1 524 470 Q478 462 432 470 Z"/>
    <path d="M558 470 A46 40 0 0 1 650 470 Q604 462 558 470 Z"/>
  </g>
  <!-- slightly grumpy brows -->
  <g stroke="#2a1640" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M440 412 Q478 410 516 422"/><path d="M566 422 Q604 410 642 412"/>
  </g>
  <!-- blush -->
  <g fill="#ff8fc8" opacity=".55"><ellipse cx="425" cy="535" rx="26" ry="13"/><ellipse cx="658" cy="535" rx="26" ry="13"/></g>
  <!-- relaxed content smile (slightly lopsided) -->
  <path d="M500 548 Q548 590 600 545" fill="none" stroke="#2a1640" stroke-width="12" stroke-linecap="round"/>
  <path d="M597 540 q10 -4 12 -14" fill="none" stroke="#2a1640" stroke-width="9" stroke-linecap="round"/>

  <!-- arm holding bong -->
  <path d="M270 700 Q300 640 360 612" fill="none" stroke="#2a1640" stroke-width="40" stroke-linecap="round"/>
  <path d="M270 700 Q300 640 360 612" fill="none" stroke="#e7b0e6" stroke-width="24" stroke-linecap="round"/>

  <!-- BONG: classic straight glass beaker bong, tilted, mouthpiece at mouth -->
  <g transform="rotate(-28 330 720)">
    <g stroke="#2a1640" stroke-width="12" stroke-linejoin="round">
      <!-- beaker -->
      <path d="M268 880 L292 760 L368 760 L392 880 Q396 902 372 902 L288 902 Q264 902 268 880 Z" fill="url(#glass)"/>
      <!-- tube -->
      <rect x="306" y="480" width="48" height="285" rx="8" fill="url(#glass)"/>
      <!-- mouthpiece flare -->
      <path d="M300 488 L360 488 L366 470 L294 470 Z" fill="url(#glass)"/>
      <!-- ice notches -->
      <path d="M306 620 h10 M354 620 h-10" fill="none"/>
      <!-- downstem + bowl -->
      <path d="M368 830 L420 800" fill="none"/>
      <path d="M408 778 L452 778 L444 808 L416 808 Z" fill="#9aa2ad"/>
    </g>
    <!-- water -->
    <path d="M276 850 L384 850 L390 880 Q392 896 372 896 L288 896 Q268 896 270 880 Z" fill="#5fd9a0" opacity=".65"/>
    <g fill="#fff" opacity=".9"><circle cx="310" cy="872" r="6"/><circle cx="340" cy="862" r="4"/><circle cx="360" cy="878" r="5"/></g>
    <!-- smoke inside -->
    <rect x="314" y="500" width="32" height="255" fill="#f3eefb" opacity=".55"/>
    <!-- shine -->
    <path d="M316 500 V740 M282 790 L274 870" stroke="#fff" stroke-opacity=".8" stroke-width="6" stroke-linecap="round"/>
    <!-- ember -->
    <circle cx="430" cy="776" r="24" fill="url(#ember)"/><circle cx="430" cy="776" r="8" fill="#ff6a00"/>
  </g>
  <!-- hand around tube -->
  <ellipse cx="368" cy="608" rx="30" ry="24" fill="#e7b0e6" stroke="#2a1640" stroke-width="10" transform="rotate(-28 368 608)"/>
  <path d="M352 596 l20 -8 M358 612 l20 -8" stroke="#2a1640" stroke-width="5" stroke-linecap="round"/>

  <!-- smoke wisp from mouth corner -->
  <g fill="none" stroke="#f3eefb" stroke-linecap="round">
    <path d="M610 530 C640 500 620 470 655 440" stroke-width="12" opacity=".9"/>
    <circle cx="672" cy="400" r="12" stroke-width="6"/>
  </g>
  <!-- sparkles -->
  <g fill="#ffe14d" stroke="#2a1640" stroke-width="5">
    <path d="M860 340 l8 20 l20 8 l-20 8 l-8 20 l-8 -20 l-20 -8 l20 -8 Z"/>
    <path d="M170 420 l7 17 l17 7 l-17 7 l-7 17 l-7 -17 l-17 -7 l17 -7 Z"/>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
